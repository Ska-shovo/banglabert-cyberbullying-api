services:
  - type: web
    name: banglabert-cyberbullying-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_ID
        value: kumarshuvo605/banglabert-cyberbullying
